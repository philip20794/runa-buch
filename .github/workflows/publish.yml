name: LaTeX PDF veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reader-Tests
        run: node --test tests/*.test.mjs

      - name: LaTeX kompilieren
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          texlive_version: 2026

      - name: PDF prüfen
        run: test -s main.pdf

      - name: PDF.js beziehen und Webseite erstellen
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pdfjs" \
            --no-save --ignore-scripts --no-audit --no-fund pdfjs-dist@6.5.438
          PDFJS="$RUNNER_TEMP/pdfjs/node_modules/pdfjs-dist"
          mkdir -p site/vendor
          cp -R web/. site/
          cp main.pdf site/dokument.pdf
          cp "$PDFJS/build/pdf.mjs" site/vendor/pdf.mjs
          cp "$PDFJS/build/pdf.worker.mjs" site/vendor/pdf.worker.mjs
          cp -R "$PDFJS/cmaps" site/vendor/cmaps
          cp -R "$PDFJS/standard_fonts" site/vendor/standard_fonts
          printf '{"sha":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > site/version.json
          test -s site/dokument.pdf
          test -s site/vendor/pdf.worker.mjs
          test -s site/version.json

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Seitenartefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
